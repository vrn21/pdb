# Patch to reduce resource limits for local development
# This makes the pod run comfortably on a laptop
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pdb-postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: pdb-indexes
      spec:
        resources:
          requests:
            storage: 500Mi
