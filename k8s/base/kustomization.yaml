# Kustomize configuration for pdb K8s resources
# Apply with: kubectl apply -k k8s/base
#
# For environment-specific configs, use overlays:
#   kubectl apply -k k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Common labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/part-of: pdb
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

# Resources in apply order
resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 10-secret.yaml
  - 20-statefulset.yaml
  - 30-service.yaml
  - 40-pdb.yaml
