# Secret for PostgreSQL credentials
# WARNING: This is a TEMPLATE. Do NOT commit real passwords!
#
# For production, use one of:
#   - Sealed Secrets: https://github.com/bitnami-labs/sealed-secrets
#   - External Secrets Operator: https://external-secrets.io/
#   - kubectl create secret (imperative, safer)
#
# Create secret imperatively:
#   kubectl create secret generic pdb-secrets \
#     --namespace=pdb \
#     --from-literal=POSTGRES_USER=pdb_admin \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
#
apiVersion: v1
kind: Secret
metadata:
  name: pdb-secrets
  namespace: pdb
  labels:
    app.kubernetes.io/name: pdb
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Default dev credentials - CHANGE FOR PRODUCTION
  POSTGRES_USER: "pdb_admin"
  POSTGRES_PASSWORD: "pdb_dev_password_change_me"
